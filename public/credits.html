<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Design & Credits · Zihan Wang</title><link rel="icon" type="image/png" href="/favicon.png?v=2"><style>body{max-width:700px;margin:60px auto;padding:0 24px;font:15px/1.8 system-ui,sans-serif;color:#333}h1{font-family:Georgia,serif;font-size:32px}h2{font-size:17px;margin-top:30px}a{color:#2d795f}small{color:#888}button{font:inherit;background:#f2f8f3;color:#2d795f;border:1px solid #c9dfce;border-radius:20px;padding:3px 12px;cursor:pointer;float:right}ul{padding-left:22px}</style></head><body><button id="language" type="button">中文</button><a href="/" id="back">← Back to homepage</a><div id="content"></div><script>
const copy={en:`<h1>Design & Credits</h1><p>This is the personal website of Zihan Wang (王子涵). Research figures, project images, and photography are credited to their respective authors and projects.</p><h2>Visual references</h2><p>The academic layout is independently implemented with visual reference to <a href="https://long-ling.com/">Long Ling’s homepage</a>. The violet palette draws from <a href="https://tongtongjin.art/">Tongtong Jin’s website</a>. The green homepage and violet version share the same layout and content.</p><h2>Typography</h2><p>Section headings use <a href="https://fonts.google.com/specimen/Sigmar+One">Sigmar One</a>, distributed under the <a href="/assets/fonts/OFL-Sigmar-One.txt">SIL Open Font License</a>. Body text uses the system sans-serif stack.</p><h2>Interface icons</h2><p>General interface icons are from <a href="https://lucide.dev/">Lucide</a>, under the <a href="/assets/icons/LICENSE-Lucide.txt">ISC / MIT licenses</a>. The GitHub mark is from <a href="https://github.com/primer/octicons">GitHub Octicons</a> (<a href="/assets/icons/LICENSE-Octicons.txt">MIT</a>); Xiaohongshu and Bilibili marks are from <a href="https://simpleicons.org/">Simple Icons</a> (<a href="/assets/icons/LICENSE-Simple-Icons.txt">CC0 1.0</a>).</p><h2>Images & demonstrations</h2><ul><li>Portrait and research figures: Zihan Wang’s supplied materials. The portrait uses a locally computed background mask, with its photographic colors preserved; its crown and thumb accents come from the supplied character artwork.</li><li>ObjectTalk, CityLens, Ymoon, Bactrian, Moonwalk, Human Atlas 3D, CargoTwin, Harbour Stack, RepoPilot, and OpenSHTU: original project repositories or public demonstrations.</li><li>PPTAgent and TechPie logos belong to their respective projects. Project repositories and contribution summaries are available on the homepage.</li><li>Human Atlas 3D anatomical imagery adapts <a href="https://dbarchive.biosciencedbc.jp/en/bodyparts3d/lic.html">BodyParts3D</a>, © The Database Center for Life Science, and <a href="https://humanatlas.io/3d-reference-library">Human Reference Atlas / HuBMAP</a> materials. Credits include Indiana University’s CNS Center, Kristen Browne, Heidi Schlehlein, versioned-object contributors, and the NIH / National Library of Medicine Visible Human Project. Anatomical data and screenshots are distributed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>; project adaptations and screenshot composition © 2026 Zihan Wang. See the <a href="https://github.com/wangzh12023/human-atlas-3d/blob/main/public/ATTRIBUTION.md">complete attribution and adaptation details</a>.</li><li>Organization marks: <a href="https://geekpie.club/">GeekPie</a>, <a href="https://www.shanghaitech.edu.cn/">ShanghaiTech University</a> / <a href="https://sist.shanghaitech.edu.cn/">SIST</a>, and <a href="https://hyper3d.ai/">Deemos / Hyper3D</a> official websites. The MARS laboratory image comes from the <a href="https://ieeevr.org/2023/program/social-events/">IEEE VR 2023 official lab-tour introduction</a>.</li><li>VDI Center and ISCAS: original marks from the <a href="https://sist.shanghaitech.edu.cn/2026/0522/c2858a1122866/page.htm">center’s official introduction</a> and <a href="https://www.iscas.ac.cn/">institute website</a>.</li><li>2025 Shanghai Yangtze River Half Marathon course photograph: event organizer, via the <a href="https://www.shcm.gov.cn/xwzx/002003/20260319/6e78a62e-9d70-460a-8608-10250399aaf5.html">Chongming Media Center / Chongming District Government</a>. This is an official archive image of the 2025 event; rights remain with the respective owners.</li><li>Browser icon: character artwork supplied by the site owner, with its paper background removed.</li><li>Photography: Zihan Wang’s <a href="https://500px.com.cn/p/Lull1221">500px portfolio</a>.</li></ul><p>Project credits and third-party asset licenses remain with their respective repositories. Project screenshots show the respective projects; contribution summaries describe my work.</p><small>© 2026 Zihan Wang. Personal photographs are not licensed for reuse.</small>`,zh:`<h1>设计与致谢</h1><p>这是王子涵（Zihan Wang）的个人主页。研究配图、项目展示和摄影作品的权利归各自作者及项目所有。</p><h2>视觉参考</h2><p>页面独立实现，学术主页布局参考<a href="https://long-ling.com/">Long Ling 的个人主页</a>；紫色配色参考<a href="https://tongtongjin.art/">Tongtong Jin 的个人网站</a>。绿色主页与紫色版本使用相同布局及内容。</p><h2>字体</h2><p>章节标题使用 <a href="https://fonts.google.com/specimen/Sigmar+One">Sigmar One</a>，遵循 <a href="/assets/fonts/OFL-Sigmar-One.txt">SIL 开放字体许可证</a>；正文使用系统无衬线字体。</p><h2>界面图标</h2><p>通用图标采用 <a href="https://lucide.dev/">Lucide</a> 官方 SVG，遵循 <a href="/assets/icons/LICENSE-Lucide.txt">ISC / MIT 许可证</a>。GitHub 标志来自 <a href="https://github.com/primer/octicons">GitHub Octicons</a>（<a href="/assets/icons/LICENSE-Octicons.txt">MIT</a>）；小红书与哔哩哔哩标志来自 <a href="https://simpleicons.org/">Simple Icons</a>（<a href="/assets/icons/LICENSE-Simple-Icons.txt">CC0 1.0</a>）。</p><h2>图像与演示</h2><ul><li>肖像与研究配图：王子涵提供的个人材料。头像通过本地背景遮罩处理，保留原照片颜色；皇冠与拇指装饰来自提供的角色图像。</li><li>ObjectTalk、CityLens、Ymoon、Bactrian、Moonwalk、Human Atlas 3D、CargoTwin、Harbour Stack、RepoPilot 及 OpenSHTU：对应项目仓库或公开演示。</li><li>PPTAgent、TechPie 标志归各项目所有；主页提供源仓库与贡献说明。</li><li>Human Atlas 3D 解剖图像改编自 <a href="https://dbarchive.biosciencedbc.jp/en/bodyparts3d/lic.html">BodyParts3D</a>（© The Database Center for Life Science）及 <a href="https://humanatlas.io/3d-reference-library">Human Reference Atlas / HuBMAP</a> 资料。署名包括印第安纳大学 CNS 中心、Kristen Browne、Heidi Schlehlein、各版本参考模型的贡献者，以及 NIH / 美国国家医学图书馆 Visible Human Project。解剖数据与截图遵循 <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>；项目改编及截图编排 © 2026 王子涵。详见<a href="https://github.com/wangzh12023/human-atlas-3d/blob/main/public/ATTRIBUTION.md">完整署名与改编说明</a>。</li><li>机构标志来自 <a href="https://geekpie.club/">GeekPie</a>、<a href="https://www.shanghaitech.edu.cn/">上海科技大学</a>、<a href="https://sist.shanghaitech.edu.cn/">信息科学与技术学院</a>及 <a href="https://hyper3d.ai/">Deemos / Hyper3D</a> 官网；MARS 实验室图像来自 <a href="https://ieeevr.org/2023/program/social-events/">IEEE VR 2023 官方实验室参访介绍</a>。</li><li>视觉与数据智能中心、软件所标志：来自<a href="https://sist.shanghaitech.edu.cn/2026/0522/c2858a1122866/page.htm">中心官方介绍</a>和<a href="https://www.iscas.ac.cn/">软件所官网</a>。</li><li>2025 上海长江半程马拉松赛道图：赛事方提供，经<a href="https://www.shcm.gov.cn/xwzx/002003/20260319/6e78a62e-9d70-460a-8608-10250399aaf5.html">崇明区融媒体中心 / 崇明区政府</a>发布，明确标注为 2025 年赛事资料图；图像权利归原权利人所有。</li><li>浏览器图标：网站作者提供的形象图像，已移除纸张背景。</li><li>摄影：王子涵的 <a href="https://500px.com.cn/p/Lull1221">500px 作品集</a>。</li></ul><p>项目及第三方素材的署名和许可证以原仓库为准。项目截图用于介绍对应项目，贡献说明描述我参与的工作。</p><small>© 2026 王子涵。个人摄影作品未经许可不得转载。</small>`};const requested=new URLSearchParams(location.search).get('lang');let saved=null;try{saved=localStorage.getItem('zihan-locale')}catch{}let lang=requested==='en'||requested==='zh'?requested:saved==='en'||saved==='zh'?saved:'en';function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.getElementById('content').innerHTML=copy[lang];document.getElementById('language').textContent=lang==='zh'?'English':'中文';document.getElementById('language').setAttribute('aria-label',lang==='zh'?'切换为英文':'Switch to Chinese');document.getElementById('back').textContent=lang==='zh'?'← 返回主页':'← Back to homepage';document.getElementById('back').href='/?lang='+lang;document.title=(lang==='zh'?'设计与致谢':'Design & Credits')+' · Zihan Wang'}document.getElementById('language').onclick=()=>{lang=lang==='zh'?'en':'zh';try{localStorage.setItem('zihan-locale',lang)}catch{}const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState(null,'',url);render()};render();</script></body></html>
